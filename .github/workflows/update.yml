name: Update BioLingua Daily

on:
  schedule:
    - cron: "15 5 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Fetch and build today's snapshot
        run: node scripts/update.mjs

      - name: Commit daily snapshot
        run: |
          git config user.name "BioLingua Bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "Daily update $(date -u +%F)"
          git push
